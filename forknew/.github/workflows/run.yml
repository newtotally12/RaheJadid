name: Forknew 5h55m Runner

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Start application
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f bot.py ]; then
            python bot.py
          elif [ -f app.py ]; then
            python app.py
          else
            echo "No main.py, bot.py, or app.py found."
            exit 1
          fi
        env:
          PYTHONUNBUFFERED: "1"

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting next run..."
          sleep 5
          gh workflow run run.yml \
            --repo "${{ github.repository }}"
