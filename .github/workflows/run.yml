name: RaheJadid 5h55m Runner

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Reflex
        run: |
          pip install reflex

      - name: Start RaheJadid
        run: |
          reflex run --env prod
        env:
          PYTHONUNBUFFERED: "1"

      - name: Start next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Current run finished."
          echo "Starting next run in 5 seconds..."
          sleep 5
          gh workflow run run.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"